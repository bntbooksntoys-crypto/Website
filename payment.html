<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment | B'N'T Books 'N' Toys</title>
    <meta
      name="description"
      content="Complete your payment for your selected subscription."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="light">
    <header class="site-header">
      <div class="container nav">
        <a href="index.html" class="brand">B'N'T Books 'N' Toys</a>
        <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="subscription.html">Plans</a>
          <a href="login.html">Login</a>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
            🌙
          </button>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <section class="hero">
        <div class="container hero-content">
          <div class="auth-card">
            <p class="eyebrow">Secure payment</p>
            <h1>Complete Your Payment</h1>
            <p class="lead">Enter your payment details to confirm your selected package.</p>

            <form class="auth-form">
              <div class="payment-options">
                <label class="payment-option">
                  <input type="radio" name="paymentMethod" value="card" checked />
                  <span>Credit / Debit Card</span>
                </label>
                <label class="payment-option payment-option-image">
                  <input type="radio" name="paymentMethod" value="upi" />
                  <img src="upi.svg" alt="UPI payment option" />
                  <span>UPI</span>
                </label>
                <label class="payment-option payment-option-image">
                  <input type="radio" name="paymentMethod" value="netbanking" />
                  <img src="netbanking.svg" alt="Net Banking payment option" />
                  <span>Net Banking</span>
                </label>
              </div>

              <label class="field">
                <span>Cardholder Name</span>
                <input type="text" placeholder="Your name" required />
              </label>

              <label class="field">
                <span>Card Number</span>
                <input type="text" placeholder="1234 5678 9012 3456" required />
              </label>

              <div class="payment-row">
                <label class="field">
                  <span>Expiry</span>
                  <input type="text" placeholder="MM/YY" required />
                </label>
                <label class="field">
                  <span>CVV</span>
                  <input type="text" placeholder="123" required />
                </label>
              </div>

              <button class="button primary" type="submit">Pay Now</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <p>© <span id="year"></span> B'N'T Books 'N' Toys</p>
        <p>Built with HTML, CSS, and JavaScript.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
